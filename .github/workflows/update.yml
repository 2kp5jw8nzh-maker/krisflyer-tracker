name: Check KrisFlyer promo pages

on:
  schedule:
    - cron: '0 0 */3 * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check promo pages
        run: python check_promos.py

      - name: Commit changes if any
        run: |
          git config user.name "krisflyer-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json state.json
          if ! git diff --cached --quiet; then
            git commit -m "Automated promo check $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          else
            echo "No changes to commit."
          fi
